services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-qaforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-qaforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qaforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    environment:
      NODE_ENV:              production
      API_PORT:              8000
      # Set to true only to bootstrap the first admin account, then remove
      REGISTRATION_ENABLED:  ${REGISTRATION_ENABLED:-false}
      DATABASE_URL:       postgresql://${POSTGRES_USER:-qaforge}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-qaforge}
      REDIS_URL:          redis://redis:6379
      JWT_SECRET:         ${JWT_SECRET:?JWT_SECRET must be set}
      WEB_BASE_URL:       ${WEB_BASE_URL:-http://localhost}
      MINIO_ENDPOINT:     http://minio:9000
      MINIO_ACCESS_KEY:   ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY:   ${MINIO_ROOT_PASSWORD:-changeme}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  uploads:
